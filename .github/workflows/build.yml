name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.5
      - name: Build
        shell: bash
        run: |
          L="$GITHUB_WORKSPACE/build.log"
          P=$(find . -name pubspec.yaml -not -path "*/.*" -not -path "*/build/*" | head -1)
          [ -z "$P" ] && echo "ERROR: pubspec.yaml not found" | tee "$L" && ls -R | head -50 | tee -a "$L" && exit 1
          cd "$(dirname "$P")"
          echo "Project folder: $(pwd)" | tee "$L"
          M=$(find lib -iname main.dart 2>/dev/null | head -1)
          [ -z "$M" ] && echo "ERROR: lib/main.dart not found" | tee -a "$L" && exit 1
          [ -f assets/index.html ] || { echo "ERROR: assets/index.html not found" | tee -a "$L"; exit 1; }
          [ -f android/app/build.gradle ] || [ -f android/app/build.gradle.kts ] || flutter create --org com.blindtalent --project-name light_of_mind --platforms android .
          sed -i -E 's/(minSdk(Version)?[ =]+)flutter\.minSdkVersion/\124/' android/app/build.gradle* || true
          MF=android/app/src/main/AndroidManifest.xml
          grep -q 'permission.INTERNET' $MF || sed -i 's|<manifest[^>]*>|&<uses-permission android:name="android.permission.INTERNET"/>|' $MF
          grep -q 'TTS_SERVICE' $MF || sed -i 's|<manifest[^>]*>|&<queries><intent><action android:name="android.intent.action.TTS_SERVICE"/></intent></queries>|' $MF
          APPID="ca-app-pub-5481902015314492~1735182591"
          grep -q 'ads.APPLICATION_ID' $MF || python3 - "$MF" "$APPID" <<'MF_PY'
          import re,sys
          p,a=sys.argv[1],sys.argv[2]
          s=open(p,encoding="utf-8").read()
          s=re.sub(r'(<application\b[^>]*>)',lambda m:m.group(1)+'<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="'+a+'"/>',s,count=1)
          open(p,"w",encoding="utf-8").write(s)
          MF_PY
          if [ -f android/app/build.gradle ]; then GR=android/app/build.gradle; else GR=android/app/build.gradle.kts; fi
          grep -q 'play-services-ads' "$GR" || { case "$GR" in *.kts) printf '\ndependencies {\n    implementation("com.google.android.gms:play-services-ads:23.2.0")\n}\n' >> "$GR";; *) printf "\ndependencies {\n    implementation 'com.google.android.gms:play-services-ads:23.2.0'\n}\n" >> "$GR";; esac; }
          grep -c 'play-services-ads' "$GR" | tee -a "$L" || true
          grep -c 'ads.APPLICATION_ID' $MF | tee -a "$L" || true
          for KF in android/settings.gradle android/settings.gradle.kts android/build.gradle android/build.gradle.kts; do
            if [ -f "$KF" ]; then
              sed -i -e 's/\(org.jetbrains.kotlin.android"[^0-9]*\)[0-9][0-9.]*/\11.9.22/' -e 's/\(kotlin_version[^0-9]*\)[0-9][0-9.]*/\11.9.22/' "$KF"
              grep -n 'kotlin' "$KF" | head -3 | tee -a "$L" || true
            fi
          done
          MA=$(find android/app/src/main -name 'MainActivity.*' | head -1)
          [ -z "$MA" ] && echo "ERROR: MainActivity not found" | tee -a "$L" && exit 1
          PK=$(grep -m1 '^package ' "$MA" | sed 's/package //; s/;//; s/ //g')
          echo "Native package: $PK  file: $MA" | tee -a "$L"
          ASSETS=android/app/src/main/assets
          mkdir -p "$ASSETS"
          cp assets/index.html "$ASSETS/index.html"
          cat > "$ASSETS/shim.js" <<'SHIM_EOF'
          (function () {
            var cbs = {}, n = 0;
            window.__ntResolve = function (id, ok, payload) {
              var c = cbs[id];
              if (!c) return;
              delete cbs[id];
              if (ok) c.res(payload); else c.rej(payload);
            };
            window.flutter_inappwebview = {
              callHandler: function (name) {
                var args = Array.prototype.slice.call(arguments, 1);
                return new Promise(function (res, rej) {
                  var id = "c" + (++n);
                  cbs[id] = { res: res, rej: rej };
                  try {
                    window.AndroidTTS.call(name, JSON.stringify(args), id);
                  } catch (e) {
                    delete cbs[id];
                    rej(e);
                  }
                });
              }
            };
          })();
          SHIM_EOF
          sed -i '0,/<head>/s//<head><script src="shim.js"><\/script>/' "$ASSETS/index.html"
          grep -c 'shim.js' "$ASSETS/index.html" | tee -a "$L"
          for MODJS in soundscape.js ads.js; do
            if [ -f "assets/$MODJS" ]; then
              cp "assets/$MODJS" "$ASSETS/$MODJS"
              python3 - "$ASSETS/index.html" "$MODJS" <<'SND_PY'
          import sys
          p,m=sys.argv[1],sys.argv[2]
          h=open(p,encoding="utf-8").read()
          tag='<script src="'+m+'"></script>'
          i=h.rfind('</body>')
          h=h[:i]+tag+'\n'+h[i:] if i>=0 else h+'\n'+tag
          open(p,"w",encoding="utf-8").write(h)
          SND_PY
              echo "$MODJS injected" | tee -a "$L"
            else
              echo "no assets/$MODJS (skipped)" | tee -a "$L"
            fi
          done
          rm -f "$MA"
          cat > "$(dirname "$MA")/MainActivity.kt" <<'KT_EOF'
          package PKG_PLACEHOLDER

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import android.view.WindowManager
          import android.webkit.JavascriptInterface
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import com.google.android.gms.ads.AdError
          import com.google.android.gms.ads.AdRequest
          import com.google.android.gms.ads.FullScreenContentCallback
          import com.google.android.gms.ads.LoadAdError
          import com.google.android.gms.ads.MobileAds
          import com.google.android.gms.ads.OnUserEarnedRewardListener
          import com.google.android.gms.ads.rewarded.RewardedAd
          import com.google.android.gms.ads.rewarded.RewardedAdLoadCallback
          import org.json.JSONArray
          import org.json.JSONObject
          import java.util.Locale
          import java.util.concurrent.ConcurrentHashMap

          class MainActivity : Activity() {
              private lateinit var web: WebView
              private var tts: TextToSpeech? = null
              private var ttsReady = false
              private var engineName = ""
              private val pending = ConcurrentHashMap<String, String>()private var uttCounter = 0
              private var rewarded: RewardedAd? = null
              private var adLoading = false

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  try {
                      MobileAds.initialize(this) {}
                  } catch (e: Exception) {
                  }
                  web = WebView(this)
                  setContentView(web)
                  val s = web.settings
                  s.javaScriptEnabled = true
                  s.domStorageEnabled = true
                  s.allowFileAccess = true
                  s.mediaPlaybackRequiresUserGesture = false
                  s.setSupportZoom(false)
                  web.setBackgroundColor(0xFF0B1020.toInt())
                  web.addJavascriptInterface(Bridge(), "AndroidTTS")
                  web.webChromeClient = WebChromeClient()
                  web.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(view: WebView?, request: WebResourceRequest?): Boolean {
                          val u = request?.url ?: return false
                          val sc = u.scheme ?: return false
                          if (sc == "http" || sc == "https" || sc == "mailto" || sc == "tel") {
                              try {
                                  startActivity(Intent(Intent.ACTION_VIEW, u))
                              } catch (e: Exception) {
                              }
                              return true
                          }
                          return false
                      }
                  }
                  web.loadUrl("file:///android_asset/index.html")
              }

              inner class Bridge {
                  @JavascriptInterface
                  fun call(name: String, argsJson: String, id: String) {
                      runOnUiThread {
                          try {
                              handle(name, JSONArray(argsJson), id)
                          } catch (e: Exception) {
                              reject(id, e.toString())
                          }
                      }
                  }
              }

              private fun resolve(id: String, json: String) {
                  web.evaluateJavascript("window.__ntResolve('" + id + "',true," + json + ")", null)
              }

              private fun reject(id: String, msg: String) {
                  web.evaluateJavascript("window.__ntResolve('" + id + "',false," + JSONObject.quote(msg) + ")", null)
              }

              private fun handle(name: String, args: JSONArray, id: String) {
                  when (name) {
                      "ttsInit" -> {
                          val engine = if (args.isNull(0)) "" else args.optString(0, "")
                          ensureTts(engine) { resolve(id, buildInit().toString()) }
                      }
                      "ttsSpeak" -> {
                          val p = args.optJSONObject(0)
                          if (p == null) {
                              resolve(id, "true")
                          } else {
                              ensureTts("") { speak(p, id) }
                          }
                      }
                      "ttsStop" -> {
                          tts?.stop()
                          resolve(id, "true")
                      }
                      "adLoad" -> loadAd(if (args.isNull(0)) "" else args.optString(0, ""), id)
                      "adShow" -> showAd(id)
                      else -> reject(id, "unknown handler: " + name)
                  }
              }

              private fun loadAd(unit: String, id: String) {
                  if (rewarded != null) {
                      resolve(id, "true")
                      return
                  }
                  if (adLoading || unit.isEmpty()) {
                      resolve(id, "false")
                      return
                  }
                  adLoading = true
                  try {
                      RewardedAd.load(this, unit, AdRequest.Builder().build(), object : RewardedAdLoadCallback() {
                          override fun onAdLoaded(ad: RewardedAd) {
                              rewarded = ad
                              adLoading = false
                              resolve(id, "true")
                          }

                          override fun onAdFailedToLoad(error: LoadAdError) {
                              rewarded = null
                              adLoading = false
                              resolve(id, "false")
                          }
                      })
                  } catch (e: Exception) {
                      adLoading = false
                      resolve(id, "false")
                  }
              }

              private fun showAd(id: String) {
                  val ad = rewarded
                  if (ad == null) {
                      resolve(id, "false")
                      return
                  }
                  rewarded = null
                  var earned = false
                  try {
                      tts?.stop()
                  } catch (e: Exception) {
                  }
                  ad.fullScreenContentCallback = object : FullScreenContentCallback() {
                      override fun onAdDismissedFullScreenContent() {
                          resolve(id, if (earned) "true" else "false")
                      }

                      override fun onAdFailedToShowFullScreenContent(error: AdError) {
                          resolve(id, "false")
                      }
                  }
                  try {
                      ad.show(this, OnUserEarnedRewardListener { earned = true })
                  } catch (e: Exception) {
                      resolve(id, "false")
                  }
              }

              private fun ensureTts(engine: String, onReady: () -> Unit) {
                  val cur = tts
                  if (cur != null && ttsReady && (engine.isEmpty() || engine == engineName)) {
                      onReady()
                      return
                  }
                  if (cur != null) {
                      try {
                          cur.shutdown()
                      } catch (e: Exception) {
                      }
                  }
                  ttsReady = false
                  val listener = TextToSpeech.OnInitListener { status ->
                      runOnUiThread {
                          ttsReady = (status == TextToSpeech.SUCCESS)
                          if (ttsReady) {
                              tts?.setOnUtteranceProgressListener(object : UtteranceProgressListener() {override fun onStart(utteranceId: String?) {}
                                  override fun onDone(utteranceId: String?) {
                                      utteranceDone(utteranceId)
                                  }

                                  @Deprecated("Deprecated in Java")
                                  override fun onError(utteranceId: String?) {
                                      utteranceDone(utteranceId)
                                  }

                                  override fun onStop(utteranceId: String?, interrupted: Boolean) {
                                      utteranceDone(utteranceId)
                                  }
                              })
                          }
                          onReady()
                      }
                  }
                  if (engine.isEmpty()) {
                      tts = TextToSpeech(this, listener)
                  } else {
                      engineName = engine
                      tts = TextToSpeech(this, listener, engine)
                  }
              }

              private fun utteranceDone(utteranceId: String?) {
                  if (utteranceId == null) return
                  val cb = pending.remove(utteranceId) ?: return
                  runOnUiThread { resolve(cb, "true") }
              }

              private fun buildInit(): JSONObject {
                  val o = JSONObject()
                  val engines = JSONArray()
                  var current = ""
                  val t = tts
                  if (t != null) {
                      try {
                          for (e in t.engines) engines.put(e.name)
                          current = t.defaultEngine ?: ""
                      } catch (e: Exception) {
                      }
                  }
                  val voices = JSONArray()
                  if (t != null && ttsReady) {
                      try {
                          val vs = t.voices
                          if (vs != null) {
                              for (v in vs) {
                                  val vo = JSONObject()
                                  vo.put("name", v.name)
                                  vo.put("locale", v.locale.toLanguageTag())
                                  vo.put("network_required", if (v.isNetworkConnectionRequired) "1" else "0")
                                  voices.put(vo)
                              }
                          }
                      } catch (e: Exception) {
                      }
                  }
                  o.put("engines", engines)
                  o.put("engine", if (engineName.isNotEmpty()) engineName else current)
                  o.put("rate", JSONObject().put("normal", 0.5).put("min", 0.05).put("max", 1.0))
                  o.put("pitch", JSONObject().put("normal", 1.0))
                  o.put("voices", voices)
                  return o
              }

              private fun speak(p: JSONObject, id: String) {
                  val t = tts
                  val text = p.optString("text", "")
                  if (t == null || !ttsReady || text.trim().isEmpty()) {
                      resolve(id, "true")
                      return
                  }
                  try {
                      val lang = p.optString("lang", "bn-BD")
                      t.language = Locale.forLanguageTag(lang)
                      val vj = p.optJSONObject("voice")
                      if (vj != null) {
                          val vn = vj.optString("name", "")
                          if (vn.isNotEmpty()) {
                              val vs = t.voices
                              if (vs != null) {
                                  for (v in vs) {
                                      if (v.name == vn) {
                                          t.voice = v
                                          break
                                      }
                                  }
                              }
                          }
                      }
                      t.setSpeechRate((p.optDouble("rate", 0.5) * 2.0).toFloat())
                      t.setPitch(p.optDouble("pitch", 1.0).toFloat())
                      var vol = p.optDouble("volume", 1.0)
                      if (vol < 0.0) vol = 0.0
                      if (vol > 1.0) vol = 1.0
                      val params = Bundle()
                      params.putFloat(TextToSpeech.Engine.KEY_PARAM_VOLUME, vol.toFloat())
                      uttCounter += 1
                      val uid = "u" + uttCounter
                      pending[uid] = id
                      val r = t.speak(text, TextToSpeech.QUEUE_FLUSH, params, uid)
                      if (r != TextToSpeech.SUCCESS) {
                          pending.remove(uid)
                          resolve(id, "true")
                      }
                  } catch (e: Exception) {
                      resolve(id, "true")
                  }
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  if (web.canGoBack()) web.goBack() else super.onBackPressed()
              }

              override fun onDestroy() {
                  try {
                      tts?.stop()
                      tts?.shutdown()
                  } catch (e: Exception) {
                  }
                  web.destroy()
                  super.onDestroy()
              }
          }
          KT_EOF
          sed -i "s/PKG_PLACEHOLDER/$PK/" "$(dirname "$MA")/MainActivity.kt"
          head -3 "$(dirname "$MA")/MainActivity.kt" | tee -a "$L"
          flutter pub get 2>&1 | tee -a "$L"
          flutter build apk --release --no-shrink -t "$M" 2>&1 | tee -a "$L"
      - name: Show real error
        if: failure()
        shell: bash
        run: |
          echo "=========== REAL ERROR START ==========="
          grep -A 14 "What went wrong" build.log | head -45
          echo "=========== CAUSED BY ==========="
          grep -B1 -A 4 "Caused by" build.log | head -25
          grep -E "^e: |error:" build.log | head -20
          echo "=========== REAL ERROR END ==========="
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result
          path: |
            **/flutter-apk/*.apk
            build.log
      - uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: build-${{ github.run_number }}
          name: APK ${{ github.run_number }}
          files: "**/flutter-apk/app-release.apk"