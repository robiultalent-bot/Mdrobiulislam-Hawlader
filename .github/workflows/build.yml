name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.5
      - name: Build
        shell: bash
        run: |
          L="$GITHUB_WORKSPACE/build.log"
          P=$(find . -name pubspec.yaml -not -path "*/.*" -not -path "*/build/*" | head -1)
          [ -z "$P" ] && echo "ERROR: pubspec.yaml not found" | tee "$L" && ls -R | head -50 | tee -a "$L" && exit 1
          cd "$(dirname "$P")"
          echo "Project folder: $(pwd)" | tee "$L"
          M=$(find lib -iname main.dart 2>/dev/null | head -1)
          [ -z "$M" ] && echo "ERROR: lib/main.dart not found" | tee -a "$L" && exit 1
          [ -f assets/index.html ] || { echo "ERROR: assets/index.html not found" | tee -a "$L"; exit 1; }
          [ -f android/app/build.gradle ] || [ -f android/app/build.gradle.kts ] || flutter create --org com.blindtalent --project-name light_of_mind --platforms android .
          sed -i -E 's/(org\.jetbrains\.kotlin\.android"[ ,)]*version[ ("]*)[0-9.]+/\12.1.0/' android/settings.gradle* || true
          sed -i -E 's/(minSdk(Version)?[ =]+)flutter\.minSdkVersion/\124/' android/app/build.gradle* || true
          if ! grep -q 'p.android.compileSdkVersion == null' android/build.gradle; then
            printf '%s\n' 'subprojects {' '    afterEvaluate { p ->' '        if (p.hasProperty("android") && p.android.compileSdkVersion == null) {' '            p.android.compileSdkVersion 34' '        }' '    }' '}' | cat - android/build.gradle > android/build.gradle.new && mv android/build.gradle.new android/build.gradle
          fi
          echo "=== android/build.gradle ===" | tee -a "$L"
          head -12 android/build.gradle | tee -a "$L"
          MF=android/app/src/main/AndroidManifest.xml
          grep -q 'permission.INTERNET' $MF || sed -i 's|<manifest[^>]*>|&<uses-permission android:name="android.permission.INTERNET"/>|' $MF
          grep -q 'permission.WAKE_LOCK' $MF || sed -i 's|<manifest[^>]*>|&<uses-permission android:name="android.permission.WAKE_LOCK"/>|' $MF
          grep -q 'TTS_SERVICE' $MF || sed -i 's|<manifest[^>]*>|&<queries><intent><action android:name="android.intent.action.TTS_SERVICE"/></intent></queries>|' $MF
          flutter pub get 2>&1 | tee -a "$L"
          flutter build apk --release --no-shrink -t "$M" 2>&1 | tee -a "$L"
      - name: Show real error
        if: failure()
        shell: bash
        run: |
          echo "=========== REAL ERROR START ==========="
          grep -A 14 "What went wrong" build.log | head -45
          echo "=========== CAUSED BY ==========="
          grep -B1 -A 4 "Caused by" build.log | head -25
          echo "=========== REAL ERROR END ==========="
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result
          path: |
            **/flutter-apk/*.apk
            build.log
      - uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: build-${{ github.run_number }}
          name: APK ${{ github.run_number }}
          files: "**/flutter-apk/app-release.apk"