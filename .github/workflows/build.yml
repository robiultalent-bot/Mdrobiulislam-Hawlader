name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.5
      - name: Mark build number
        shell: bash
        run: echo "window.__LOM_BUILD=${{ github.run_number }};" > assets/lombuild.js
      - name: Build
        shell: bash
        run: |
          ls -la
          ls -la native
          S=$(find . -name build.sh -not -path "./.git/*" | head -1)
          echo "found: $S"
          bash "$S"
      - name: Show real error
        if: always()
        shell: bash
        run: |
          echo "=========== REAL ERROR START ==========="
          grep -E "^e: |error:" build.log | head -20 || true
          grep -n -B2 -A4 "^e: " build.log | head -60 || true
          echo "----------- LAST LINES -----------"
          tail -60 build.log || true
          echo "=========== REAL ERROR END ==========="
      - name: Notes
        if: always()
        shell: bash
        run: |
          { echo "build ${{ github.run_number }}"; grep -E "FALLBACK|enabled|patch failed|RETRY|skipped" build.log | head -40; echo "--- errors ---"; grep -E "^e: |error:|What went wrong" -A2 build.log | head -80; } > notes.txt || true
          [ -f notes.txt ] || echo "no notes" > notes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result
          path: |
            **/flutter-apk/*.apk
            build.log
      - uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: build-${{ github.run_number }}
          name: APK ${{ github.run_number }}
          body_path: notes.txt
          files: "**/flutter-apk/app-release.apk"
