name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: LIST FILES
        run: |
          echo "--- root ---"
          ls -la | cat -A
          echo "--- lib ---"
          ls -la lib | cat -A
          echo "--- pubspec ---"
          ls -la pubspec.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with: