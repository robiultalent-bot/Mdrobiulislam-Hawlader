name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Flutter project and add files
        run: |
          flutter create --org com.lightofmind --project-name light_of_mind --platforms=android app
          mkdir -p app/assets
          cp index.html app/assets/index.html
          cp main.dart app/lib/main.dart
          cp pubspec.yaml app/pubspec.yaml
          python3 - <<'PY'
          p = 'app/android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          perms = ('<uses-permission android:name="android.permission.INTERNET"/>\n'
                   '<uses-permission android:name="android.permission.RECORD_AUDIO"/>\n'
                   '<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\n')
          tts = '<intent><action android:name="android.intent.action.TTS_SERVICE"/></intent>\n'
          if '<queries>' in s:
              s = s.replace('<queries>', '<queries>\n' + tts, 1)
              extra = perms
          else:
              extra = perms + '<queries>\n' + tts + '</queries>\n'
          i = s.index('>', s.index('<manifest')) + 1
          s = s[:i] + '\n' + extra + s[i:]
          open(p, 'w', encoding='utf-8').write(s)
          PY
      - name: Build release APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: light-of-mind-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk