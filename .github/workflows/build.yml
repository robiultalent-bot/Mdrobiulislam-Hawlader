name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.5
      - name: Build
        shell: bash
        run: bash native/build.sh
      - name: Show real error
        if: always()
        shell: bash
        run: |
          echo "=========== REAL ERROR START ==========="
          grep -E "^e: |error:" build.log | head -20 || true
          grep -n -B2 -A4 "^e: " build.log | head -60 || true
          echo "----------- LAST LINES -----------"
          tail -60 build.log || true
          echo "=========== REAL ERROR END ==========="
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result
          path: |
            **/flutter-apk/*.apk
            build.log
      - uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: build-${{ github.run_number }}
          name: APK ${{ github.run_number }}
          files: "**/flutter-apk/app-release.apk"
